function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};

const MSG='I want kitchen and bath leads.';
const TS={in:CTA,type0:CTA+.35,type1:CTA+1.8,press:CTA+1.95,sent:CTA+2.1,dm:DMT-.05};
function sCTA(c,t){

      const last=L[L.length-1];c.fillStyle=COL.lime;c.beginPath();c.arc(W/2-30+last.x+last.w/2+40,lerp(300,560+s*.36-28,b),28,0,TAU);c.fill()}}

function ctaSfx(){sfx(TS.in,'whoosh',.4);for(let i=0;i<MSG.length;i++)sfx(TS.type0+i*(1.45/MSG.length)+((i*7)%5)*.004,'type',.9);sfx(TS.sent,'send');sfx(TS.dm,'impact',.9);[.3636,.7273,.9091,.9773].forEach((x0,j)=>sfx(TS.dm+.45+.4*x0,'blipdot',Math.pow(.55,j)))}

// ───────────────────────── frame ─────────────────────────
const HITS=[];
function camera(t){let x=0,y=0,z=1,r=0;for(const[h,ty,g]of SFX){const s={impact:1.1,stamp:1.2,thud:.5,buzz:.4,pop:.25,ding:.3,coin:.15,chip:.15,send:.5,shrink:.3}[ty];if(!s)continue;const a=t-h;if(a<0||a>.6)continue;const e=Math.exp(-a*13);const S=s*g;z+=.03*S*e;x+=14*S*Math.exp(-a*16)*Math.sin(a*90+h*13);y+=14*S*Math.exp(-a*16)*Math.cos(a*77+h*7);r+=.004*S*e*Math.sin(a*60+h)}return{x,y,z,r}}
function glitchAmt(t){let g=0;for(const[h,ty]of SFX){if(ty!=='buzz'&&ty!=='stamp')continue;const q=t-h;if(q>=0&&q<.07)g=Math.max(g,(ty==='buzz'?.6:.35)*(1-q/.07))}return g}

// captions
const CAPS=R.vo.map(([s,e,txt],i)=>{const words=txt.split(' ');const wts=words.map(w=>w.length+2),tot=wts.reduce((a,b)=>a+b,0);let acc=s;const wt=words.map((w,k)=>{const st=acc;acc+=(e-s)*wts[k]/tot;return st});
  const next=R.vo[i+1]?R.vo[i+1][0]:DUR;return{s,e,words,wt,end:Math.min(next-.05,e+.45)}});
function captions(c,t){
  const cap=CAPS.find(k=>t>=k.s-.08&&t<k.end);if(!cap)return;
  const size=54,lh=68,maxW=900;c.font=FI(800,size);
  const sp=c.measureText(' ').width;const lines=[[]];let lw=0;
  cap.words.forEach((w,k)=>{const ww=c.measureText(w).width;if(lw+ww>maxW&&lines[lines.length-1].length){lines.push([]);lw=0}lines[lines.length-1].push({w,ww,k});lw+=ww+sp});
  const a=P(t,cap.s-.08,cap.s+.04)*(1-P(t,cap.end-.1,cap.end));const cy=350;const top=cy-(lines.length*lh)/2;
  let maxL=0;lines.forEach(l=>{maxL=Math.max(maxL,l.reduce((s,o)=>s+o.ww+sp,-sp))});
  c.save();c.globalAlpha=a;rr(c,W/2-maxL/2-34,top-18,maxL+68,lines.length*lh+36,30);c.fillStyle='rgba(11,11,16,.82)';c.fill();
  lines.forEach((l,li)=>{let x=W/2-l.reduce((s,o)=>s+o.ww+sp,-sp)/2;const y=top+li*lh+lh*.72;
    l.forEach(o=>{const wt=cap.wt[o.k],e=P(t,wt-.04,wt+.1);const active=t>=wt&&(o.k===cap.words.length-1?t<cap.e+.1:t<cap.wt[o.k+1]);
      c.globalAlpha=a*e;c.fillStyle=active?COL.lime:COL.cream;c.textAlign='left';c.fillText(o.w,x,y+10*(1-E.outCubic(e)));x+=o.ww+sp})});
  c.restore();
}
let GRAIN=[];
function makeGrain(){for(let k=0;k<4;k++){const g=document.createElement('canvas');g.width=g.height=512;const gx=g.getContext('2d'),id=gx.createImageData(512,512),Rr=rng(k*31+5);for(let i=0;i<id.data.length;i+=4){const v=Rr()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}gx.putImageData(id,0,0);GRAIN.push(out.createPattern(g,'repeat'))}}
function hud(c,t){const a=P(t,.2,.6)*(1-P(t,TS.dm,TS.dm+.3));if(a<=0)return;

function post(c,t,f){

  c.save();c.globalCompositeOperation='overlay';c.globalAlpha=.08;const ox=Math.floor(hash(f)*512),oy=Math.floor(hash(f+.5)*512);c.translate(-ox,-oy);c.fillStyle=GRAIN[f%4];c.fillRect(0,0,W+512,H+512);c.restore();
  {const a=E.outExpo(P(t,0,.5))*(1-P(t,TS.dm,TS.dm+.4));if(a>0){c.save();c.globalAlpha=a*.09;c.strokeStyle='#F3EEE4';c.lineWidth=3;c.font=FD(900,560);c.textAlign='center';c.strokeText(String(RI+1).padStart(2,'0'),W/2,1880+60*(1-E.outExpo(P(t,0,.6))));c.restore()}}

}
const SUBS=3,SHUT=.5/FPS;
function renderFrame(f,subs=SUBS){const t=f/FPS;out.setTransform(1,0,0,1,0,0);out.globalCompositeOperation='source-over';

SFXSPEC[RI]();ctaSfx();SFX.sort((a,b)=>a[0]-b[0]);
