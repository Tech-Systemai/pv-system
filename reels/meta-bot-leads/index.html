<!doctype html>
<html><head><meta charset="utf-8"><title>Bot Leads</title>
<style>html,body{margin:0;background:#000;overflow:hidden;display:flex;justify-content:center}canvas{display:block;height:100vh;width:56.25vh}</style>
</head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// ───────────────────────── core ─────────────────────────
const W=1080,H=1920,FPS=60,DUR=32,B=.5;
const ALT=location.search.includes('alt');
const cv=document.getElementById('c'),out=cv.getContext('2d');
const mk=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;return c};
const buf=mk(),bx=buf.getContext('2d'),tmp=mk(),tx=tmp.getContext('2d');
const COL={ink:'#0B0B10',cream:'#F3EEE4',coral:'#FF4F2E',cobalt:'#2E44FF',lime:'#D4FF3A',violet:'#9B6BFF',green:'#1FA85A',panel:'#16161E',gray:'#24242E',field:'#E6E0D4',muted:'#8A857C',row:'#ECE6DA'};
const TAU=Math.PI*2;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const P=(t,a,b)=>clamp((t-a)/(b-a));
const E={
  outExpo:x=>x>=1?1:1-Math.pow(2,-10*x), inExpo:x=>x<=0?0:Math.pow(2,10*x-10),
  inOutExpo:x=>x<=0?0:x>=1?1:x<.5?Math.pow(2,20*x-10)/2:(2-Math.pow(2,-20*x+10))/2,
  outCubic:x=>1-Math.pow(1-x,3), inCubic:x=>x*x*x, inOutCubic:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
  outBack:x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)},
  outElastic:x=>x<=0?0:x>=1?1:Math.pow(2,-10*x)*Math.sin((x*10-.75)*(TAU/3))+1,
};
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
function hexRGB(h){const p=parseInt(h.slice(1),16);return[p>>16,p>>8&255,p&255]}
function mixHex(a,b,t){const A=hexRGB(a),Bc=hexRGB(b);return `rgb(${lerp(A[0],Bc[0],t)|0},${lerp(A[1],Bc[1],t)|0},${lerp(A[2],Bc[2],t)|0})`}
const FD=(w,s)=>`${w} ${s}px "Inter Display","Inter",sans-serif`;
const FI=(w,s)=>`${w} ${s}px "Inter",sans-serif`;
const FM=(s,w='')=>`${w} ${s}px "DejaVu Sans Mono",monospace`;
function bg(c,col){c.fillStyle=col;c.fillRect(-600,-600,W+1200,H+1200)}
function fit(c,text,size,weight,maxW){c.font=FD(weight,size);const w=c.measureText(text).width;return w>maxW?size*maxW/w:size}
function textC(c,str,x,y,size,weight=900){c.font=FD(weight,size);c.textAlign='center';c.textBaseline='alphabetic';c.fillText(str,x,y+size*.36)}
function layout(c,text,size,weight,track=0){c.font=FD(weight,size);c.textAlign='left';c.textBaseline='alphabetic';const ws=[...text].map(ch=>c.measureText(ch).width);const total=ws.reduce((a,b)=>a+b,0)+track*(ws.length-1);let x=-total/2;return[...text].map((ch,i)=>{const o={ch,x:x+ws[i]/2,w:ws[i]};x+=ws[i]+track;return o})}
// letters rise in from a mask line
function riseText(c,str,cx,cy,size,t0,t,col,weight=900,maxW=980,stag=.025){const s=fit(c,str,size,weight,maxW);const L=layout(c,str,s,weight,-s*.02);c.save();c.beginPath();c.rect(-100,cy-s*.62,W+200,s*1.2);c.clip();c.fillStyle=col;
  L.forEach((o,j)=>{const e=E.outExpo(P(t,t0+j*stag,t0+j*stag+.45));if(e<=0)return;c.fillText(o.ch,cx+o.x-o.w/2,cy+s*.36+s*1.1*(1-e))});c.restore();return s}
function slamText(c,str,cx,cy,size,t0,t,col,weight=900,maxW=980){const s=fit(c,str,size,weight,maxW);const e=P(t,t0,t0+.16);if(e<=0)return;const sc=lerp(2.2,1,E.outExpo(e));c.save();c.translate(cx,cy);c.scale(sc,sc);c.globalAlpha*=Math.min(1,e*3);c.fillStyle=col;textC(c,str,0,0,s,weight);c.restore()}
function rr(c,x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r)}
function checkPath(c,x,y,s,lw,col,p=1){c.save();c.strokeStyle=col;c.lineWidth=lw;c.lineCap='round';c.lineJoin='round';c.beginPath();const pts=[[-.5,0],[-.15,.35],[.55,-.4]];const L1=.49,L2=1.03,tot=L1+L2,d=p*tot;c.moveTo(x+pts[0][0]*s,y+pts[0][1]*s);
  if(d<=L1){const f=d/L1;c.lineTo(x+lerp(pts[0][0],pts[1][0],f)*s,y+lerp(pts[0][1],pts[1][1],f)*s)}else{c.lineTo(x+pts[1][0]*s,y+pts[1][1]*s);const f=(d-L1)/L2;c.lineTo(x+lerp(pts[1][0],pts[2][0],f)*s,y+lerp(pts[1][1],pts[2][1],f)*s)}c.stroke();c.restore()}
function xPath(c,x,y,s,lw,col){c.save();c.strokeStyle=col;c.lineWidth=lw;c.lineCap='round';c.beginPath();c.moveTo(x-s/2,y-s/2);c.lineTo(x+s/2,y+s/2);c.moveTo(x+s/2,y-s/2);c.lineTo(x-s/2,y+s/2);c.stroke();c.restore()}
function drawBot(c,x,y,s,col=COL.coral,rot=0){c.save();c.translate(x,y);c.rotate(rot);c.fillStyle=col;c.strokeStyle=col;c.lineWidth=s*.08;c.beginPath();c.moveTo(0,-s*.5);c.lineTo(0,-s*.72);c.stroke();c.beginPath();c.arc(0,-s*.76,s*.09,0,TAU);c.fill();
  rr(c,-s*.5,-s*.5,s,s*.86,s*.2);c.fill();c.fillStyle=COL.ink;c.fillRect(-s*.28,-s*.22,s*.16,s*.2);c.fillRect(s*.12,-s*.22,s*.16,s*.2);c.fillRect(-s*.22,s*.12,s*.44,s*.06);c.restore()}
function drawHuman(c,x,y,s,col){c.save();c.translate(x,y);c.fillStyle=col;c.beginPath();c.arc(0,-s*.2,s*.24,0,TAU);c.fill();c.beginPath();c.arc(0,s*.55,s*.42,Math.PI,0);c.fill();c.restore()}
function houseGlyph(c,x,y,s,col){c.save();c.translate(x,y);c.fillStyle=col;c.beginPath();c.moveTo(0,-s*.5);c.lineTo(s*.5,-s*.05);c.lineTo(s*.36,-s*.05);c.lineTo(s*.36,s*.45);c.lineTo(-s*.36,s*.45);c.lineTo(-s*.36,-s*.05);c.lineTo(-s*.5,-s*.05);c.closePath();c.fill();c.fillStyle=COL.ink;c.fillRect(-s*.1,s*.12,s*.2,s*.33);c.restore()}
function pill(c,x,y,text,font,fg,bgc,padX=22,h=52,align='center',border){c.font=font;const w=c.measureText(text).width+padX*2;const x0=align==='center'?x-w/2:align==='right'?x-w:x;rr(c,x0,y-h/2,w,h,h/2);c.fillStyle=bgc;c.fill();if(border){c.strokeStyle=border;c.lineWidth=3;c.stroke()}c.fillStyle=fg;c.textAlign='left';c.textBaseline='middle';c.fillText(text,x0+padX,y+1);c.textBaseline='alphabetic';return{x0,w}}

// ───────────────────────── voiceover timing (captions) ─────────────────────────
const VO_MAIN=[[0.35,3.40,'A remodeler told me he spent six thousand dollars on ads.'],[3.60,4.71,'Every lead was fake.']];
const VO_ALT=[[0.40,2.03,'Getting lots of leads from Meta,'],[2.80,3.98,'but nobody picks up?']];
const VO_REST=[[5.60,6.10,'Why?'],[6.20,7.47,'Some leads aren’t people.'],[7.60,8.34,'They’re bots.'],[8.60,10.43,'They fill out forms to look human.'],
  [11.10,13.39,'Every fake lead teaches Meta the wrong thing.'],[13.80,15.40,'So Meta sends you more bots.'],
  [16.60,17.67,'The fix is simple.'],[17.90,20.07,'Send clicks to a landing page you control,'],[20.30,22.14,'and put bot protection on that page.'],
  [23.10,24.21,'Fewer fake leads.'],[24.40,26.51,'Meta learns to send real homeowners.'],
  [27.60,29.92,'Want real kitchen and bath leads in Florida?'],[30.00,30.86,'DM us.']];
const CAPS=VO_REST.map(([s,e,txt],i)=>{const words=txt.split(' ');const wts=words.map(w=>w.length+2),tot=wts.reduce((a,b)=>a+b,0);let acc=s;const wt=words.map((w,k)=>{const st=acc;acc+=(e-s)*wts[k]/tot;return st});
  const next=VO_REST[i+1]?VO_REST[i+1][0]:DUR;return{s,e,words,wt,end:Math.min(next-.05,e+.45)}});
function captions(c,t){
  const cap=CAPS.find(k=>t>=k.s-.08&&t<k.end);if(!cap)return;
  const size=54,lh=68,maxW=900;c.font=FI(800,size);
  const sp=c.measureText(' ').width;const lines=[[]];let lw=0;
  cap.words.forEach((w,k)=>{const ww=c.measureText(w).width;if(lw+ww>maxW&&lines[lines.length-1].length){lines.push([]);lw=0}lines[lines.length-1].push({w,ww,k});lw+=ww+sp});
  const a=P(t,cap.s-.08,cap.s+.04)*(1-P(t,cap.end-.1,cap.end));const cy=350;const top=cy-(lines.length*lh)/2;
  let maxL=0;lines.forEach(l=>{maxL=Math.max(maxL,l.reduce((s,o)=>s+o.ww+sp,-sp))});
  c.save();c.globalAlpha=a;rr(c,W/2-maxL/2-34,top-18,maxL+68,lines.length*lh+36,30);c.fillStyle='rgba(11,11,16,.82)';c.fill();
  lines.forEach((l,li)=>{let x=W/2-l.reduce((s,o)=>s+o.ww+sp,-sp)/2;const y=top+li*lh+lh*.72;
    l.forEach(o=>{const wt=cap.wt[o.k],e=P(t,wt-.04,wt+.1);const active=t>=wt&&(o.k===cap.words.length-1?t<cap.e+.1:t<cap.wt[o.k+1]);
      c.globalAlpha=a*(.0+e);c.fillStyle=active?COL.lime:COL.cream;c.textAlign='left';c.fillText(o.w,x,y+10*(1-E.outCubic(e)));x+=o.ww+sp})});
  c.restore();
}

// ───────────────────────── scene 1 · the hook ─────────────────────────
function s1main(c,t){
  bg(c,COL.ink);
  const up=E.inOutExpo(P(t,3.45,3.9));
  c.save();c.globalAlpha=1-.68*up;c.translate(0,-170*up);
  riseText(c,'A REMODELER',W/2,450,118,.35,t,COL.cream);
  riseText(c,'SPENT',W/2,575,118,1.3,t,COL.cream);
  // $6,000 roll
  if(t>=1.75){const v=6000*E.outExpo(P(t,1.75,2.6));const str='$'+(Math.round(v/10)*10).toLocaleString('en-US');const e=E.outBack(P(t,1.75,2.1));
    const s=fit(c,'$6,000',300,900,960);c.save();c.translate(W/2,790);c.scale(e,e);c.fillStyle=COL.lime;textC(c,str,0,0,s);c.restore();
    const sk=E.outExpo(P(t,4.35,4.65));if(sk>0){c.save();c.globalAlpha=1;c.strokeStyle=COL.coral;c.lineWidth=22;c.lineCap='round';c.beginPath();c.moveTo(W/2-430,800);c.lineTo(W/2-430+860*sk,780);c.stroke();c.restore()}}
  riseText(c,'ON ADS.',W/2,985,118,2.75,t,COL.cream);
  c.restore();
  riseText(c,'EVERY LEAD',W/2,1000,138,3.6,t,COL.cream);
  if(t>=4.3){const s=fit(c,'FAKE.',300,900,900);const e=P(t,4.3,4.46);const sc=lerp(2.4,1,E.outExpo(e));c.save();c.translate(W/2,1165);c.scale(sc,sc);
    c.globalCompositeOperation='lighter';c.fillStyle=COL.cobalt;textC(c,'FAKE.',-10*(1-P(t,4.3,5)),0,s);c.globalCompositeOperation='source-over';c.fillStyle=COL.coral;textC(c,'FAKE.',0,0,s);c.restore()}
}
function s1alt(c,t){
  bg(c,COL.ink);
  riseText(c,'LOTS OF',W/2,410,104,.4,t,COL.cream);
  riseText(c,'META LEADS.',W/2,530,140,.85,t,COL.lime);
  const labels=['Kitchen remodel','Bath remodel','Kitchen remodel','Bath remodel'];
  for(let k=0;k<4;k++){const t0=1.05+k*.25,e=E.outBack(P(t,t0,t0+.4));if(e<=0)continue;const y=690+k*82,flip=P(t,2.85+k*.12,2.85+k*.12+.22);const sy=Math.abs(Math.cos(flip*Math.PI));const bad=flip>=.5;
    c.save();c.translate(W/2+(1-e)*700,y);c.scale(1,sy);rr(c,-360,-32,720,64,32);c.fillStyle=bad?'#2A1410':COL.panel;c.fill();c.strokeStyle=bad?COL.coral:'rgba(243,238,228,.15)';c.lineWidth=2;c.stroke();
    if(!bad){c.fillStyle=COL.lime;c.beginPath();c.arc(-322,0,9,0,TAU);c.fill();c.font=FI(700,28);c.fillStyle=COL.cream;c.textAlign='left';c.textBaseline='middle';c.fillText('New lead · '+labels[k],-296,1);c.font=FM(20);c.fillStyle=COL.muted;c.textAlign='right';c.fillText('just now',330,1)}
    else{xPath(c,-322,0,16,5,COL.coral);c.font=FI(700,28);c.fillStyle=COL.coral;c.textAlign='left';c.textBaseline='middle';c.fillText('Called · no answer',-296,1);c.font=FM(20);c.fillStyle='rgba(255,79,46,.7)';c.textAlign='right';c.fillText('×'+(k+2),330,1)}
    c.textBaseline='alphabetic';c.restore()}
  slamText(c,'NOBODY',W/2,1065,150,2.8,t,COL.coral);
  slamText(c,'PICKS UP?',W/2,1200,150,3.25,t,COL.cream);
}

// ───────────────────────── scene 2 · the bot form ─────────────────────────
const FIELDS=[['NAME','Mike Johnson'],['PHONE','(813) 555-0147'],['EMAIL','mike.j8841@mail-box.xyz'],['PROJECT','Kitchen remodel']];
function drawForm(c,cx,cy,s,tt,botFace,stampAge,glow=0){
  c.save();c.translate(cx,cy);c.scale(s,s);
  rr(c,-380,-400,760,800,40);c.fillStyle=COL.cream;c.fill();
  if(glow>0){c.strokeStyle=COL.coral;c.globalAlpha=glow;c.lineWidth=8;c.stroke();c.globalAlpha=1}
  // avatar
  const ax=-280,ay=-300;c.beginPath();c.arc(ax,ay,52,0,TAU);c.fillStyle=botFace>.5?'#2A1410':COL.field;c.fill();
  if(botFace>.5)drawBot(c,ax,ay+8,52,COL.coral);else{c.save();c.beginPath();c.arc(ax,ay,52,0,TAU);c.clip();drawHuman(c,ax,ay+6,80,COL.muted);c.restore()}
  c.textAlign='left';c.font=FI(800,46);c.fillStyle=COL.ink;c.fillText('New lead',-205,-308);c.font=FM(22);c.fillStyle=COL.muted;c.fillText('via Meta lead form',-205,-270);
  let cur=null;
  FIELDS.forEach(([lab,val],i)=>{const y=-200+i*122,st=.3+i*.25;c.font=FM(20,'bold');c.fillStyle=COL.muted;c.fillText(lab,-330,y);
    rr(c,-330,y+14,660,74,14);c.fillStyle=COL.field;c.fill();
    const n=Math.floor(val.length*P(tt,st,st+.2));c.font=FI(600,32);c.fillStyle=COL.ink;const txt=val.slice(0,n);c.fillText(txt,-305,y+62);
    if(tt>=st-.06&&tt<st+.25){cur=[-305+c.measureText(txt).width,y+51];c.fillStyle=COL.coral;c.fillRect(cur[0]+4,y+30,4,40)}});
  // submit
  const pr=tt>1.3&&tt<1.45;rr(c,-330+(pr?6:0),300+(pr?3:0),660-(pr?12:0),70,35);c.fillStyle=COL.ink;c.fill();c.font=FM(26,'bold');c.fillStyle=COL.cream;c.textAlign='center';c.fillText('SUBMIT',0,345);
  // robot cursor (snaps, no easing)
  if(tt>.2&&tt<1.6){const [px,py]=tt>1.2?[60,335]:cur?[cur[0]+40,cur[1]+10]:[260,-150];c.fillStyle=COL.ink;c.beginPath();c.moveTo(px,py);c.lineTo(px,py+44);c.lineTo(px+12,py+33);c.lineTo(px+30,py+34);c.closePath();c.fill();
    c.font=FM(18,'bold');const tw=c.measureText('autofill 0.02s').width;rr(c,px+30,py+40,tw+20,30,8);c.fillStyle=COL.coral;c.fill();c.fillStyle=COL.cream;c.textAlign='left';c.fillText('autofill 0.02s',px+40,py+61)}
  // stamp
  if(stampAge>=0){const e=E.outExpo(clamp(stampAge/.13)),sc=lerp(2.8,1,e);c.save();c.translate(70,40);c.rotate(-.24);c.scale(sc,sc);c.globalAlpha=Math.min(1,stampAge/.04)*.93;
    rr(c,-250,-115,500,230,28);c.strokeStyle=COL.coral;c.lineWidth=18;c.stroke();c.fillStyle=COL.coral;textC(c,'BOT',0,-2,200);
    c.globalAlpha=1;c.fillStyle=COL.cream;const R=rng(77);for(let k=0;k<70;k++){c.beginPath();c.arc((R()-.5)*520,(R()-.5)*240,R()*5+1,0,TAU);c.fill()}c.restore()}
  c.restore();
}
const GRID_ORDER=[3,0,6,1,7,2,5,4];
function s2(c,t){
  bg(c,COL.ink);
  // WHY?
  if(t<6.35){const e=P(t,5.5,5.66),x=E.inExpo(P(t,6.0,6.3));const sc=lerp(2,1,E.outExpo(e))*(1-.3*x);c.save();c.translate(W/2,860-900*x);c.scale(sc,sc);c.fillStyle=COL.cream;textC(c,'WHY?',0,0,fit(c,'WHY?',330,900,960));c.restore()}
  if(t<6.0)return;
  const en=E.outExpo(P(t,6.0,6.5)),pb=E.inOutExpo(P(t,8.45,9.1)),ex=E.inExpo(P(t,10.5,10.95));
  const tt=t-6.0,botFace=t>=7.6+(hash(Math.floor(t*30))>.5?.04:0)?1:(t>7.5?(hash(Math.floor(t*60))>.5?1:0):0);
  const cells=[];for(let r=0;r<3;r++)for(let q=0;q<3;q++)cells.push([540+(q-1)*305,850+(r-1)*300]);
  // other cards
  if(pb>0){GRID_ORDER.forEach((ci,k)=>{const idx=[0,1,2,3,5,6,7,8][k];const e=E.outBack(P(t,8.75+k*.045,8.75+k*.045+.32));if(e<=0)return;
    const [x,y]=cells[idx];const sa=t-(9.5+ci*.09);const s=.36*e*(1-ex);if(s<=0)return;
    drawForm(c,lerp(x,540,ex),lerp(y,850,ex),s,t-8.85,1,sa>=0?sa:-1,0)})}
  // hero card
  const s=lerp(.95,.36,pb)*(1-ex);if(s>0){const y=lerp(850+1300*(1-en),850,pb);drawForm(c,540,y,s,tt,botFace,t>=7.85?t-7.85:-1,0);}
  // counter
  const ca=P(t,9.2,9.4)*(1-ex);if(ca>0){c.save();c.globalAlpha=ca;c.font=FD(900,64);c.textAlign='center';c.fillStyle=COL.cream;
    const n=Math.min(9,1+GRID_ORDER.filter((ci)=>t>=9.5+ci*.09).length);c.fillText(`${n} LEADS  ·  `,W/2-110,1360);c.fillStyle=COL.coral;c.fillText('0 HUMANS',W/2+190,1360);c.restore()}
}

// ───────────────────────── scene 3 · the loop ─────────────────────────
const LC={x:540,y:850,r:290};
const F3=t=>{const u=clamp((t-11.5)/4.7);return .32*Math.max(0,t-11.5)+1.5*u*u*u};
function drawLoop(c,t){
  const {x:cx,y:cy,r}=LC;
  const ring=E.outExpo(P(t,11.0,11.6));c.strokeStyle='rgba(243,238,228,.14)';c.lineWidth=4;c.beginPath();c.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+TAU*ring);c.stroke();
  // arcs
  const arc=(p,start,lab,sub,lx)=>{if(p<=0)return;c.strokeStyle=COL.coral;c.lineWidth=10;c.lineCap='round';c.beginPath();c.arc(cx,cy,r,start,start-Math.PI*p*.82,true);c.stroke();
    const a=start-Math.PI*p*.82,hx=cx+Math.cos(a)*r,hy=cy+Math.sin(a)*r,dx=Math.sin(a),dy=-Math.cos(a);c.fillStyle=COL.coral;c.beginPath();c.moveTo(hx+dx*30,hy+dy*30);c.lineTo(hx-dy*20-dx*6,hy+dx*20-dy*6);c.lineTo(hx+dy*20-dx*6,hy-dx*20-dy*6);c.fill()};
  arc(E.outCubic(P(t,11.2,11.9)),Math.PI/2-.28,'','',0);
  arc(E.outCubic(P(t,13.8,14.5)),-Math.PI/2-.28,'','',0);
  // particles
  for(let i=0;i<64;i++){const b=11.5+4.4*Math.sqrt(i/64);if(t<b)continue;const ph=F3(t)-F3(b);const a=Math.PI/2-TAU*ph;const ap=Math.min(1,(t-b)*6);
    const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;c.globalAlpha=ap;drawBot(c,x,y,30+6*P(t,13,16),COL.coral,a*.3);c.globalAlpha=1}
  // nodes

  const ch=P(t,15.2,16.2)*(t<16.5?1:0);x+=ch*10*Math.sin(t*70);y+=ch*10*Math.cos(t*63);return{x,y,z,r}}
const GL=[[4.3,.1,1],[5.38,.14,.9],[7.6,.08,.9],[16.2,.1,.8],[23.0,.06,.5]];
function glitchAmt(t){let g=0;const L=ALT?[[2.8,.1,1],[5.38,.14,.9],[7.6,.08,.9],[16.2,.1,.8],[23.0,.06,.5]]:GL;for(const[s,d,a]of L){const q=t-s;if(q>=0&&q<d)g=Math.max(g,a*(1-q/d))}
  if(t>15.5&&t<16.2&&hash(Math.floor(t*20))>.7)g=Math.max(g,.35);if(t>5.25&&t<5.5)g=Math.max(g,P(t,5.25,5.5)*.8);return g}
function applyGlitch(c,g,t){tx.setTransform(1,0,0,1,0,0);tx.globalCompositeOperation='copy';tx.drawImage(buf,0,0);tx.globalCompositeOperation='source-over';
  const R=rng(Math.floor(t*FPS)*7+3);let y=0;c.setTransform(1,0,0,1,0,0);
  while(y<H){const h=8+R()*110,off=R()<.55?(R()-.5)*200*g:0;if(off)c.drawImage(tmp,0,y,W,h,off,y,W,h);if(R()<.12*g){c.globalCompositeOperation='difference';c.fillStyle=R()<.5?COL.lime:COL.coral;c.globalAlpha=.6;c.fillRect(0,y,W,h);c.globalAlpha=1;c.globalCompositeOperation='source-over'}y+=h}}
const SCENES=[[0,5.5,null],[5.5,11,s2],[11,16.5,s3],[16.5,23,s4],[23,27.5,s5],[27.5,99,s6]];
function scene(c,t){
  let fn=SCENES.find(s=>t>=s[0]&&t<s[1])[2];if(!fn)fn=ALT?s1alt:s1main;
  c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;c.globalCompositeOperation='source-over';c.setLineDash([]);c.lineCap='butt';
  const cam=camera(t);c.save();c.translate(W/2+cam.x,H/2+cam.y);c.scale(cam.z,cam.z);c.rotate(cam.r);c.translate(-W/2,-H/2);
  fn(c,t);c.restore();
  const g=glitchAmt(t);if(g>0)applyGlitch(c,g,t);
}
let GRAIN=[];
function makeGrain(){for(let k=0;k<4;k++){const g=document.createElement('canvas');g.width=g.height=512;const gx=g.getContext('2d'),id=gx.createImageData(512,512),R=rng(k*31+5);for(let i=0;i<id.data.length;i+=4){const v=R()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}gx.putImageData(id,0,0);GRAIN.push(out.createPattern(g,'repeat'))}}
const LABELS=['01 — THE PROBLEM','02 — WHY','03 — THE LOOP','04 — THE FIX','05 — THE RESULT','06 — DM US'];
function scramble(str,p,seed){const g='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789/#_';const n=Math.floor(str.length*p);let o='';for(let i=0;i<str.length;i++)o+=i<n||str[i]===' '?str[i]:(i<n+5?g[Math.floor(hash(i*7+seed)*g.length)]:'');return o}
function hud(c,t){
  const a=P(t,.3,.8)*(1-P(t,30.0,30.3));if(a<=0)return;
  const si=SCENES.findIndex(s=>t>=s[0]&&t<s[1]);
  c.save();c.globalCompositeOperation='difference';c.globalAlpha=a*.85;c.fillStyle='#fff';c.font=FM(20,'bold');c.textBaseline='middle';
  c.textAlign='left';c.fillText('@OCTOPUSENGINES',64,196);c.textAlign='right';c.fillText(scramble(LABELS[si],P(t-SCENES[si][0],0,.3),Math.floor(t*40)),W-64,196);
  c.globalAlpha=a*.3;c.fillRect(64,226,W-128,2);c.globalAlpha=a;c.fillRect(64,225,(W-128)*t/DUR,4);
  c.restore();
}
function post(c,t,f){
  const vg=c.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.4)');c.fillStyle=vg;c.fillRect(0,0,W,H);
  c.save();c.globalCompositeOperation='overlay';c.globalAlpha=.08;const ox=Math.floor(hash(f)*512),oy=Math.floor(hash(f+.5)*512);c.translate(-ox,-oy);c.fillStyle=GRAIN[f%4];c.fillRect(0,0,W+512,H+512);c.restore();
  // ghost chapter number in the (UI-covered) lower zone — decorative only
  {const si=SCENES.findIndex(s=>t>=s[0]&&t<s[1]);const lt=t-SCENES[si][0],a=E.outExpo(P(lt,0,.5))*(si===5?1-P(t,30,30.4):1)*P(t,.3,.8);if(a>0){c.save();c.globalAlpha=a*.09;c.strokeStyle='#F3EEE4';c.lineWidth=3;c.font=FD(900,560);c.textAlign='center';c.strokeText('0'+(si+1),W/2,1880+60*(1-E.outExpo(P(lt,0,.6))));c.restore()}}
  hud(c,t);if(!location.search.includes('nocap'))captions(c,t);
  const fo=1-P(t,0,.12);if(fo>0){c.fillStyle=`rgba(0,0,0,${fo})`;c.fillRect(0,0,W,H)}
}
const SUBS=3,SHUT=.5/FPS;
function renderFrame(f,subs=SUBS){const t=f/FPS;out.setTransform(1,0,0,1,0,0);out.globalCompositeOperation='source-over';
  for(let i=0;i<subs;i++){scene(bx,t+(i/subs)*SHUT);out.globalAlpha=1/(i+1);out.drawImage(buf,0,0)}
  out.globalAlpha=1;post(out,t,f)}
window.ready=(async()=>{await Promise.all([FD(900,100),FD(800,100),FI(800,50),FI(700,50),FI(600,50),FI(500,50),FM(20,'bold'),FM(20)].map(f=>document.fonts.load(f)));makeGrain();return true})();
if(!location.search.includes('render')){window.ready.then(()=>{const st=performance.now();const loop=()=>{const f=Math.floor(((performance.now()-st)/1000%DUR)*FPS);renderFrame(f,1);requestAnimationFrame(loop)};loop()})}
</script></body></html>
