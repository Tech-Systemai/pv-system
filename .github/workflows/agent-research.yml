name: Agent Research

# Every 15 minutes during the agents' working day. The window below covers
# 9–5 Eastern in both halves of the year; the portal itself enforces the hours.
# Needs the repository secret AGENT_CRON_SECRET (same value as in Vercel).

on:
  schedule:
    - cron: '*/15 13-22 * * *'
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Research new leads
        env:
          AGENT_CRON_SECRET: ${{ secrets.AGENT_CRON_SECRET }}
        run: |
          if [ -z "$AGENT_CRON_SECRET" ]; then echo "AGENT_CRON_SECRET repository secret is not set"; exit 0; fi
          curl -X POST https://portal.octopusengines.com/api/cron/agent-research \
            -H "Authorization: Bearer $AGENT_CRON_SECRET" \
            --fail-with-body \
            --max-time 310
