name: Apploye Sync

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Apploye sync
        run: |
          curl -X POST https://portal.pioneersveneers.com/api/cron/apploye-pull \
            -H "Content-Type: application/json" \
            --fail-with-body \
            --max-time 30
