name: Apploye Sync

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Apploye sync
        run: |
          curl -s -X POST https://system-psi-sable.vercel.app/api/cron/apploye-pull \
            -H "Content-Type: application/json" \
            --fail-with-body
